name: Go Build & Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Install dependencies
      run: |
        cd backend
        go mod tidy

    - name: Run tests
      run: |
        cd backend
        go test ./...

    - name: Build Docker image
      run: |
        docker build -f backend/Dockerfile -t rapidos-api ./backend
